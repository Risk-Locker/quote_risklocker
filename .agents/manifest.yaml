schema_version: "2.4"
name: "agent-harness"
description: "Balanced Risklocker Agent Harness: fast direct answers for simple queries, deep unthrottled inspection for audits/refactors, and executable wiring/SAST verification."
portable: true

model_policy:
  primary_model: "inherit"
  subagent_model_mode: "inherit"
  adaptive_depth: true

routing:
  root_contract: "AGENTS.md"
  knowledge_base_index: "docs/core/START-HERE.md"
  working_memory: "docs/core/STATE.md"
  codebase_map: "docs/generated/CODEBASE-MAP.md"
  ast_graph_report: "docs/generated/GRAPH_REPORT.md"
  skills_lock: ".agents/skills-lock.json"
  skills_index: "docs/generated/SKILLS-INDEX.md"
  plugins_dir: ".agents/plugins"
  freeze_lock_file: ".agents/.freeze.lock"
  wiring_auditor_cli: "commands/audit-wiring.py"
  security_auditor_cli: "commands/security-audit.py"
  verify_brain_cli: "commands/verify-brain.py"

tiers:
  tier_1_quick:
    trigger: "Direct questions, explanations, CSS/padding/copy tweaks"
    read_policy: "targeted_minimal"
    use_subagents: false
    checks:
      - "npx tsc --noEmit (if UI edited)"
  tier_2_standard:
    trigger: "Feature additions, endpoint fixes, DB migrations, workspace bugs"
    read_policy: "full_end_to_end_path"
    use_subagents: optional
    checks:
      - "Fresh DB session persistence verification + relevant pytest"
      - "npx tsc --noEmit (if frontend edited)"
  tier_3_audit_and_refactor:
    trigger: "System audits, dead-button/bug sweeps, architecture/refactor plans"
    read_policy: "unthrottled_full_file_reads"
    use_subagents: "parallel_research_allowed"
    skills:
      - ".agents/skills/house-inspector-audit/SKILL.md"
      - ".agents/skills/deep-refactor-architect/SKILL.md"
    checks:
      - "python commands/audit-wiring.py"
      - "python commands/security-audit.py"
      - "pytest -q && npx tsc --noEmit && npm run lint && npm run build"

roles: {}

ide_bridges:
  canonical_active_skills_dir: ".agents/skills"
  canonical_cold_vault_dir: ".agents/skills-vault"
  canonical_plugins_dir: ".agents/plugins"
  skills_lockfile: ".agents/skills-lock.json"
  active_skills_soft_cap: 50
  tracked_adapters:
    - ".github/copilot-instructions.md"
  opt_in_gitignored_junctions:
    - "claude -> .claude/skills (via --ide claude)"
    - "cursor -> .cursor/rules/*.mdc + .cursor/skills (via --ide cursor)"
  native_auto_discovered:
    - "AGENTS.md, backend/AGENTS.md, frontend/AGENTS.md, migrations/AGENTS.md"
    - ".agents/skills/*/SKILL.md (on-demand progressive disclosure)"
    - ".agents/plugins/*/plugin.json (Antigravity repo-local plugins)"
    - ".agents/hooks.json (fast deterministic lifecycle guards)"
