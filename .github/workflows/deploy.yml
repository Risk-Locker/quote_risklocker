name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quote-risklocker-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22
  DEPLOY_PATH: /var/www/html/quote_risklocker

jobs:
  test-and-build:
    name: Test backend and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run backend tests
        env:
          # Tests replace the environment themselves (patch.dict clear=True);
          # these dummies only satisfy import-time get_settings() calls.
          APP_ENV: production
          DATABASE_URL: postgresql://postgres:ci@db.ci.supabase.co:5432/postgres?sslmode=require
          AUTH_HASH_SECRET: ci_test_secret_at_least_32_characters_long
        run: python -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy main to VPS
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY_B64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured. Deployment cannot run — add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install rsync
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/quote_deploy_key
          chmod 600 ~/.ssh/quote_deploy_key
          ssh-keygen -y -f ~/.ssh/quote_deploy_key > /dev/null
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deploy directory
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/quote_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" <<EOF
            set -euo pipefail
            mkdir -p '${DEPLOY_PATH}'
            if [ ! -f '${DEPLOY_PATH}/.env' ]; then
              echo "::error::Missing ${DEPLOY_PATH}/.env on the VPS. Create it once manually from .env.example; GitHub Actions will never upload secrets."
              exit 1
            fi
          EOF

      - name: Mirror main branch to VPS
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/quote_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -p ${VPS_PORT:-22}" \
            --exclude ".git/" \
            --exclude ".env" \
            --exclude "frontend/.env" \
            --exclude "node_modules/" \
            --exclude "frontend/node_modules/" \
            --exclude ".venv/" \
            --exclude "frontend/.next/" \
            --exclude ".qc-tmp/" \
            --exclude ".pytest_cache/" \
            --exclude ".agents/" \
            --exclude ".copilot/" \
            --exclude ".skill-sources/" \
            --exclude "/fix/" \
            --exclude "*.log" \
            --exclude "*.db" \
            ./ "$VPS_USER@$VPS_HOST:${DEPLOY_PATH}/"

      - name: Provision ClamAV on the VPS
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/quote_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" <<'EOF'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            echo "== dpkg check"
            if dpkg -s clamav clamav-daemon >/dev/null 2>&1; then
              echo "clamav + clamav-daemon already installed"
            else
              echo "installing clamav + clamav-daemon"
              apt-get update -y
              apt-get install -y clamav clamav-daemon
            fi
            echo "== services"
            systemctl enable --now clamav-freshclam || true
            systemctl enable --now clamav-daemon || true
            systemctl is-enabled clamav-freshclam clamav-daemon || true
            echo "== signature database"
            for i in $(seq 1 30); do
              if [ -f /var/lib/clamav/daily.cvd ] || [ -f /var/lib/clamav/daily.cld ]; then
                echo "signature db present"
                break
              fi
              sleep 10
            done
            if [ ! -f /var/lib/clamav/daily.cvd ] && [ ! -f /var/lib/clamav/daily.cld ]; then
              echo "::error::ClamAV signature database missing after 300s."
              exit 1
            fi
            echo "== smoke scan"
            if command -v clamscan >/dev/null 2>&1; then
              clamscan --version || true
              clamscan --no-summary /etc/hosts
            else
              echo "clamscan not found; falling back to clamdscan"
              clamdscan /etc/hosts
            fi
          EOF

      - name: Install, build, migrate, and reload PM2
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/quote_deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "GITHUB_SHA='${GITHUB_SHA}' bash -s" <<'EOF'
            set -euo pipefail
            cd /var/www/html/quote_risklocker

            test -f .env || {
              echo "Missing /var/www/html/quote_risklocker/.env. Create it once on the VPS; CI never writes secrets."
              exit 1
            }

            # Backend: ensure the Python 3.12 venv exists and deps are current
            if [ ! -d .venv ]; then
              python3.12 -m venv .venv
            fi
            .venv/bin/pip install -r requirements.txt

            # Chromium for extraction + deterministic PDF rendering.
            # --with-deps self-heals a fresh box; no-op-ish when present.
            .venv/bin/playwright install --with-deps chromium

            # Frontend
            cd frontend
            npm ci
            # Heap cap: the VPS has 3.7GB RAM with clamd resident; without a
            # cap the Next build can trip the OOM killer mid-deploy.
            NODE_OPTIONS="--max-old-space-size=1536" npm run build

            # Database migrations (ledger-based + checksummed; safe every deploy).
            # Guarded: refuses to run when APP_ENV != production.
            cd ..
            PYTHONPATH=backend .venv/bin/python -m app.db.migrations

            # Pre-flight: confirm the schema matches this release before reload,
            # so a drift fails the deploy loudly instead of crash-looping.
            PYTHONPATH=backend .venv/bin/python -c "from app.db.session import verify_schema_version; verify_schema_version(); print('schema OK')"

            # Reload all three processes; startOrReload alone does not revive
            # apps that PM2 previously stopped (e.g. after a crash loop).
            RL_DEPLOY_PATH=/var/www/html/quote_risklocker pm2 startOrReload ecosystem.config.cjs --update-env || true
            pm2 start rl-quote-api rl-quote-worker rl-quote-frontend 2>/dev/null || true
            pm2 save

            # Record the deployed commit for one-command drift checks.
            echo "${GITHUB_SHA}" > .deployed-commit

            # Health gate: the backend must answer /health within 60s or the
            # deploy fails loudly (no more "succeeded" while prod is down).
            code=000
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8100/health || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            if [ "$code" != "200" ]; then
              echo "::error::Backend /health did not return 200 after deploy (last: $code)."
              exit 1
            fi
            pm2 status
          EOF