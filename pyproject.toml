[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C90", # mccabe complexity
]
ignore = [
    "E501", # line-too-long (managed by formatter)
    "B008", # do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert allowed in tests
    "S105", # hardcoded dummy password strings in tests
    "S106", # hardcoded dummy secret tokens in tests
]
"commands/*" = [
    "S101", # assert allowed in dev scripts
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".qc-tmp",
    "tests",
    "frontend",
    "migrations",
]
skips = [
    "B101", # assert used (tests and internal validation)
]
