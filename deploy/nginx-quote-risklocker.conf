# quote.risklocker.com — reverse proxy for the Risklocker Quotation Converter.
#
# This file is the HTTP (port 80) template. HTTPS is added by certbot, which
# inserts the 443/ssl block plus the 80 -> 443 redirect and sets up auto-renewal:
#   sudo certbot --nginx -d quote.risklocker.com
#
# Install:
#   sudo cp deploy/nginx-quote-risklocker.conf /etc/nginx/sites-available/quote-risklocker
#   sudo ln -s /etc/nginx/sites-available/quote-risklocker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Layout (matches docs/SETUP.md):
#   /api/  -> 127.0.0.1:8100  (FastAPI/uvicorn backend)
#   /      -> 127.0.0.1:3000  (Next.js server)

server {
    listen 80;
    listen [::]:80;
    server_name quote.risklocker.com;

    # Security headers. These live on the port-80 block and are inherited by
    # the 443 block certbot adds. CSP is pragmatic for Next.js: hydration
    # injects inline scripts/styles, and the canvas renderer uses blob/data.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Uploads: the backend caps a single source PDF at 20MB
    # (MAX_SOURCE_PDF_BYTES). nginx defaults to 1MB, so it must be raised.
    client_max_body_size 25m;

    # Backend API. The browser always calls same-origin /api; the backend
    # mounts its router under /api (backend/app/main.py include_router prefix).
    location /api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Next.js server (all non-API traffic).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}